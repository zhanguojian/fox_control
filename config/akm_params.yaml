akeman:
  ros__parameters:
    port_name: can0
    base_frame: base_link
    # true：仿真模式，不连接 CAN；false：实车模式，连接 port_name。
    simulated_robot: true
    control_rate: 50  

    # 车辆几何参数，单位为米或弧度。
    track: 0.52
    wheelbase: 0.55
    max_steer_angle: 0.75
    max_linear_speed: 1.5

    # 超过该时长未收到 cmd_vel 时发送零速命令，单位为秒。
    command_timeout: 0.5